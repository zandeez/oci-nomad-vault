stages:
  - login
  - plan
  - deploy

variables:
  VAULT_ADDR: https://vault.matrix.example.com
  NOMAD_ADDR: https://nomad.matrix.example.com

login:
  id_tokens:
    VAULT_TOKEN:
      aud: https://gitlab.com
  stage: login
  image:
    name: "python"
  script:
    - export VAULT_ADDR=${VAULT_ADDR}
    - echo "NOMAD_ADDR=${NOMAD_ADDR}" > login.env
    - python nomad_login.py >> login.env
  artifacts:
    reports:
      dotenv: login.env

plan:
  stage: plan
  dependencies:
    - login
  image:
    name: "hashicorp/levant"
    entrypoint: [ "" ]
  script:
    - levant plan matrix.nomad

deploy:
  stage: deploy
  dependencies:
    - login
  image:
    name: "hashicorp/levant"
    entrypoint: [ "" ]
  script:
    - levant deploy matrix.nomad
  when: manual
  allow_failure: true
