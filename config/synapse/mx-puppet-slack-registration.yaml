{{- with secret "kv/data/slack" -}}
as_token: {{ .Data.data.as_token }}
hs_token: {{ .Data.data.hs_token }}
{{ end }}
id: slack-puppet
namespaces:
  users:
    - exclusive: true
      regex: '@_slackpuppet_.*'
  rooms: []
  aliases:
    - exclusive: true
      regex: '#_slackpuppet_.*'
protocols: []
rate_limited: false
sender_localpart: _slackpuppet_bot
{{ if eq (env "NOMAD_TASK_NAME") "synapse" }}
url: http://{{ range nomadService "matrix-slack-mx-puppet-slack" }}{{ .Address }}:{{ .Port }}{{ end }}
{{ end }}
de.sorunome.msc2409.push_ephemeral: true
